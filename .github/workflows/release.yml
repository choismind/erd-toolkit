# 태그를 밀면 릴리스가 만들어진다.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# 버전은 태그에서 뽑아 ldflags로 박으므로 `erdtool version` 출력이 태그와
# 같아진다. 손으로 소스를 고칠 자리가 없다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 릴리스를 만들려면 쓰기가 필요하다

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 태그에서 v를 뗀 것이 버전이다. v0.1.0 -> 0.1.0
      - name: 버전 정하기
        id: ver
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 네 플랫폼 빌드
        run: bash scripts/build-release.sh "${{ steps.ver.outputs.value }}"

      # 바이너리만 받은 사람도 첫 명령을 돌려 볼 것이 있어야 한다.
      # README의 「첫 실행」이 가리키는 파일이 이 안에 있다.
      - name: 예제 챙기기
        run: zip -r dist/erdtool-examples.zip examples -x 'examples/bookstore_report/*'

      # 받은 사람이 파일이 온전한지 확인할 수 있어야 한다.
      - name: 체크섬
        working-directory: dist
        run: sha256sum erdtool-* > SHA256SUMS

      # 라이선스와 고지를 함께 올린다. 바이너리만 받은 사람도 조건을
      # 알 수 있어야 하고, MPL-2.0과 Apache-2.0이 고지를 요구한다.
      - name: 라이선스와 고지 챙기기
        run: cp LICENSE THIRD-PARTY-NOTICES.md dist/

      # 릴리스 노트는 .github/release-notes.md에 따로 둔다. 여기 인라인으로
      # 적으면 여러 줄 문자열이 YAML 블록을 깨뜨린다(실제로 한 번 깨졌다).
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file .github/release-notes.md
          dist/*
