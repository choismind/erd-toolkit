# erdtool.connections.example.yaml
#
# 이 파일을 erdtool.connections.yaml로 복사해서 쓴다.
# 복사본은 .gitignore에 걸려 있다 — 비밀번호가 평문으로 들어가기 때문이다.
#
# 섹션 이름은 자유다. 어느 DBMS인지는 섹션 이름이 아니라 DSN 스킴으로 정하므로
# PostgreSQL 인스턴스를 dev/prod 둘로 둬도 된다.
connections:
  PostgreSQL:
    # 비밀번호를 여기 적지 않아도 된다 — pgx가 PGPASSWORD 환경변수와
    # %APPDATA%\postgresql\pgpass.conf를 알아서 찾는다.
    dsn: postgres://사용자@localhost:5432/DB이름?sslmode=disable

  MySQL:
    # go-sql-driver/mysql에는 pgpass.conf에 해당하는 것이 없다.
    # MySQL 비밀번호는 여기 적거나 명령줄에 주는 수밖에 없다.
    #
    # DSN은 URL이므로 비밀번호의 특수문자는 퍼센트 인코딩한다:
    #   :  -> %3A     @  -> %40     /  -> %2F     %  -> %25
    # 예: 비밀번호가 p@ss:w  ->  mysql://사용자:p%40ss%3Aw@localhost:3306/DB이름
    # PostgreSQL 쪽도 같은 규칙이다(pgx가 URL을 그렇게 읽는다).
    dsn: mysql://사용자:비밀번호@localhost:3306/DB이름

  SQLite:
    dsn: ./app.db
